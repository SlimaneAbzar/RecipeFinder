<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecipeFinder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, system-ui, sans-serif;
      background: #fafafa;
      color: #1c1917;
      min-height: 100vh;
    }

    nav {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 0.8rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    nav .logo {
      font-size: 1.15rem;
      font-weight: 700;
      color: #166534;
    }

    nav .nav-tip {
      font-size: 0.78rem;
      color: #9ca3af;
    }

    .search-section {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 1.5rem;
    }

    .search-wrap {
      max-width: 680px;
      margin: 0 auto;
    }

    .search-label {
      font-size: 0.95rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 0.6rem;
    }

    .search-field {
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      background: #fff;
      cursor: text;
      transition: border-color 0.15s;
    }

    .search-field:focus-within {
      border-color: #16a34a;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #dcfce7;
      color: #166534;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .tag .remove {
      cursor: pointer;
      font-size: 0.9rem;
      line-height: 1;
      color: #16a34a;
      margin-left: 2px;
    }

    .tag .remove:hover { color: #dc2626; }

    .search-field input {
      flex: 1;
      min-width: 140px;
      border: none;
      outline: none;
      font-size: 0.95rem;
      padding: 2px 0;
      background: transparent;
    }

    .search-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.6rem;
    }

    .search-hint {
      font-size: 0.78rem;
      color: #9ca3af;
    }

    .search-btn {
      padding: 8px 24px;
      font-size: 0.9rem;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .search-btn:hover { background: #15803d; }
    .search-btn:disabled { background: #86efac; cursor: wait; }

    .content {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .results-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .results-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #1c1917;
    }

    .results-count {
      font-size: 0.85rem;
      color: #6b7280;
    }

    .msg {
      text-align: center;
      color: #6b7280;
      padding: 3rem 0;
      font-size: 0.95rem;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: #9ca3af;
    }

    .empty-state .icon {
      font-size: 2.5rem;
      margin-bottom: 0.8rem;
    }

    .empty-state p {
      font-size: 0.95rem;
      max-width: 320px;
      margin: 0 auto;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.15s, transform 0.15s;
    }

    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 0.75rem 0.9rem 0.85rem;
    }

    .card-body h3 {
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 0.4rem;
      color: #1c1917;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      color: #6b7280;
    }

    .card-meta .match {
      color: #16a34a;
      font-weight: 500;
    }

    .card-meta .time {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 1rem;
    }

    .modal {
      background: #fff;
      border-radius: 12px;
      max-width: 580px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 2rem;
    }

    .modal h2 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #1c1917;
    }

    .modal h3 {
      font-size: 0.9rem;
      font-weight: 600;
      margin: 1.2rem 0 0.5rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal ul {
      padding-left: 1.2rem;
      line-height: 1.7;
    }

    .modal ol {
      padding-left: 1.2rem;
      line-height: 1.8;
    }

    .modal li { margin-bottom: 0.25rem; font-size: 0.95rem; }

    .close-btn {
      margin-top: 1.5rem;
      padding: 9px 20px;
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .close-btn:hover { background: #e5e7eb; }

    @media (max-width: 500px) {
      .search-actions { flex-direction: column; gap: 8px; align-items: stretch; }
      .search-btn { width: 100%; }
      .nav .nav-tip { display: none; }
    }
  </style>
</head>
<body>
  <nav>
    <span class="logo">RecipeFinder</span>
    <span class="nav-tip">Tip: be specific with ingredients for better results</span>
  </nav>

  <div class="search-section">
    <div class="search-wrap">
      <div class="search-label">What ingredients do you have?</div>
      <div class="search-field" onclick="document.getElementById('ingredientInput').focus()">
        <span id="tagRow"></span>
        <input type="text" id="ingredientInput" placeholder="Type an ingredient and press Enter" />
      </div>
      <div class="search-actions">
        <span class="search-hint">Press Enter to add each ingredient</span>
        <button class="search-btn" id="searchBtn" onclick="getRecipes()">Search recipes</button>
      </div>
    </div>
  </div>

  <div class="content">
    <div id="resultsHeader" class="results-header" style="display:none;">
      <span class="results-title" id="resultsTitle"></span>
      <span class="results-count" id="resultsCount"></span>
    </div>
    <div id="msg" class="msg" style="display:none;"></div>
    <div id="emptyState" class="empty-state">
      <div class="icon">&#127860;</div>
      <p>Add the ingredients you have and search to find recipes you can make</p>
    </div>
    <div class="grid" id="results"></div>
  </div>

  <script>
    const ingredients = [];
    const input = document.getElementById("ingredientInput");
    const tagRow = document.getElementById("tagRow");

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        const val = input.value.trim().toLowerCase();
        if (val && !ingredients.includes(val)) {
          ingredients.push(val);
          renderTags();
        }
        input.value = "";
      }
      if (e.key === "Backspace" && input.value === "" && ingredients.length > 0) {
        ingredients.pop();
        renderTags();
      }
    });

    function removeIngredient(idx) {
      ingredients.splice(idx, 1);
      renderTags();
    }

    function renderTags() {
      tagRow.innerHTML = ingredients.map((ing, i) =>
        '<span class="tag">' + ing +
        '<span class="remove" onclick="event.stopPropagation(); removeIngredient(' + i + ')">&times;</span>' +
        '</span>'
      ).join("");
    }

    function getRecipes() {
      if (ingredients.length === 0) return;

      const results = document.getElementById("results");
      const msg = document.getElementById("msg");
      const btn = document.getElementById("searchBtn");
      const header = document.getElementById("resultsHeader");
      const empty = document.getElementById("emptyState");

      results.innerHTML = "";
      msg.style.display = "none";
      header.style.display = "none";
      empty.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Searching...";

      fetch("/api/recipes?ingredients=" + encodeURIComponent(ingredients.join(",")))
        .then(res => {
          if (!res.ok) throw new Error();
          return res.json();
        })
        .then(data => {
          btn.disabled = false;
          btn.textContent = "Search recipes";

          if (!data || data.length === 0) {
            msg.textContent = "No recipes found. Try different ingredients.";
            msg.style.display = "block";
            return;
          }

          data.sort((a, b) => {
            const aMissed = a.missedIngredientCount || (a.missedIngredients ? a.missedIngredients.length : 0);
            const bMissed = b.missedIngredientCount || (b.missedIngredients ? b.missedIngredients.length : 0);
            if (aMissed !== bMissed) return aMissed - bMissed;
            const aUsed = a.usedIngredientCount || (a.usedIngredients ? a.usedIngredients.length : 0);
            const bUsed = b.usedIngredientCount || (b.usedIngredients ? b.usedIngredients.length : 0);
            return bUsed - aUsed;
          });

          document.getElementById("resultsTitle").textContent = "Results for " + ingredients.join(", ");
          document.getElementById("resultsCount").textContent = data.length + " recipes";
          header.style.display = "flex";

          data.forEach(recipe => {
            const card = document.createElement("div");
            card.className = "card";

            const used = recipe.usedIngredientCount || (recipe.usedIngredients ? recipe.usedIngredients.length : 0);
            const missed = recipe.missedIngredientCount || (recipe.missedIngredients ? recipe.missedIngredients.length : 0);

            let matchText = used + "/" + (used + missed) + " ingredients";
            let timeHtml = "";
            if (recipe.readyInMinutes) {
              timeHtml = '<span class="time">&#9201; ' + recipe.readyInMinutes + ' min</span>';
            }

            card.innerHTML =
              '<img src="' + recipe.image + '" alt="' + recipe.title + '" />' +
              '<div class="card-body">' +
              '<h3>' + recipe.title + '</h3>' +
              '<div class="card-meta">' +
              '<span class="match">' + matchText + '</span>' +
              timeHtml +
              '</div>' +
              '</div>';

            card.onclick = () => showDetails(recipe.id);
            results.appendChild(card);
          });
        })
        .catch(() => {
          btn.disabled = false;
          btn.textContent = "Search recipes";
          msg.textContent = "Something went wrong. Try again.";
          msg.style.display = "block";
        });
    }

    function showDetails(id) {
      fetch("/api/recipes/" + id)
        .then(res => res.json())
        .then(data => {
          let ingredientsList = "";
          if (data.extendedIngredients) {
            ingredientsList = data.extendedIngredients
              .map(i => "<li>" + i.original + "</li>").join("");
          }

          let stepsList = "";
          if (data.analyzedInstructions && data.analyzedInstructions.length > 0) {
            stepsList = data.analyzedInstructions[0].steps
              .map(s => "<li>" + s.step + "</li>").join("");
          } else {
            stepsList = "<li>No steps available for this recipe.</li>";
          }

          const overlay = document.createElement("div");
          overlay.className = "overlay";
          overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };

          overlay.innerHTML =
            '<div class="modal">' +
            '<h2>' + data.title + '</h2>' +
            '<h3>Ingredients</h3>' +
            '<ul>' + ingredientsList + '</ul>' +
            '<h3>Steps</h3>' +
            '<ol>' + stepsList + '</ol>' +
            '<button class="close-btn" onclick="this.closest(\'.overlay\').remove()">Close</button>' +
            '</div>';

          document.body.appendChild(overlay);
        });
    }
  </script>
</body>
</html>
